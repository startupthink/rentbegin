services:
  - type: web
    name: rentbegin
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # สำคัญ: ทำให้ React Router ทำงานได้เวลารีเฟรชหน้าย่อย
    # ถ้าไม่มีบรรทัดนี้ /property/RB-3041 จะขึ้น 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
